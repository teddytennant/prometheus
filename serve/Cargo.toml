[package]
name = "prometheus-serve"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Stock SGLang deploy, router, batch generation API, last-resort provider"
publish = false

[dependencies]
prometheus-providers = { path = "../harness/providers" }
prometheus-slurm = { path = "../harness/slurm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
prometheus-providers = { path = "../harness/providers" }
prometheus-slurm = { path = "../harness/slurm" }
serde_json = "1"
tempfile = "3"

[features]
default = []
gpu = []
