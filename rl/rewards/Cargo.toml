[package]
name = "prometheus-rewards"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Rewards beyond exact verifiers: rubric graders, contrastive pairs, tampering detector"
publish = false

[dependencies]
prometheus-envs = { path = "../envs" }
prometheus-verifiers = { path = "../../verifiers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[features]
default = []
gpu = []
