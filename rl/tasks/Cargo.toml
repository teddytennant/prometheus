[package]
name = "prometheus-tasks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RL task factories: wave 1 (D3) and wave 2 types (I6, spec 9.4)"

[dependencies]
prometheus-envs = { path = "../envs" }
prometheus-rewards = { path = "../rewards" }
prometheus-verifiers = { path = "../../verifiers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
