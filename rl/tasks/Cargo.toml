[package]
name = "prometheus-tasks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RL task factories wave 1: code, SWE, math (spec 9.4, 15.5 D3)"

[dependencies]
prometheus-envs = { path = "../envs" }
prometheus-verifiers = { path = "../../verifiers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
