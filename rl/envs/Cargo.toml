[package]
name = "prometheus-envs"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Firecracker sandbox pool, snapshot fork, and F1 tool API"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = []
gpu = []
kvm = []
