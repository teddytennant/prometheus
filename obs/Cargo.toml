[package]
name = "prometheus-obs"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Metrics, tracing, run registry, dashboards, spike diagnosis (spec 15.5 F2 I10)"
publish = false

[dependencies]
prometheus-loader = { path = "../data/loader" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
