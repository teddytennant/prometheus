[package]
name = "prometheus-dedup"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Exact-hash and MinHash LSH near-duplicate detection (spec 7, 15.5 B2)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
