[package]
name = "prometheus-extract"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Ingest and extraction for HTML, PDF, and LaTeX (spec 7, 15.5 B1)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
scraper = "0.27.0"
lopdf = "0.45.0"

[dev-dependencies]
tempfile = "3"
