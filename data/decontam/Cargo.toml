[package]
name = "prometheus-decontam"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Eval decontamination and per-shard provenance (spec 7, 11, 15.5 B4)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
