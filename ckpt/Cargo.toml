[package]
name = "prometheus-ckpt"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Async sharded checkpoint, in-memory redundancy (spec 15.5 A5)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
