[package]
name = "prometheus-synth"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Synthetic data: rewrites (E1), rejection sampling (E2), procedural ARC (E3) (spec 7.1, 10, 15.5)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[features]
default = []
gpu = []
