[project]
name = "prometheus"
version = "0.0.1"
description = "Frontier model, training stack, and lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "referencing>=0.36",
    "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "jsonschema>=4.23",
    "pydantic>=2.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
