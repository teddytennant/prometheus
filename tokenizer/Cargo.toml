[package]
name = "prometheus-tokenizer"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Byte-fallback BPE tokenizer, ARC grid tokens, frozen artifact (spec 15.5 F6)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
prometheus-contracts = { path = "../crates/contracts" }
