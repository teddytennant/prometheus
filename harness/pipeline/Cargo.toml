[package]
name = "prometheus-pipeline"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Module pipeline: oracle, stub-must-fail, best-of-3, reviewer veto"
publish = false

[dependencies]
prometheus-leases = { path = "../leases" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
prometheus-leases = { path = "../leases" }
serde_json = "1"
tempfile = "3"

[features]
default = []
gpu = []
