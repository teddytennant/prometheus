[package]
name = "prometheus-eval-gate"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Held-out harness benchmark; scores only, never tasks (spec 15.5 L2)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
gpu = []
