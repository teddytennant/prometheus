[package]
name = "prometheus-ops"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Quorum-signed self-update, shadow node, harness CLI with --json status"
publish = false

[dependencies]
prometheus-cas = { path = "../cas" }
prometheus-log = { path = "../log" }
prometheus-raft = { path = "../raft" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[features]
default = []
gpu = []
