[package]
name = "prometheus-raft"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Raft-replicated control state: membership, role leases, token, kernel version"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
gpu = []
