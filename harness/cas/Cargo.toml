[package]
name = "prometheus-cas"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Content-addressed artifact store with 2+ replicas and GC"
publish = false

[dependencies]
prometheus-log = { path = "../log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
gpu = []
