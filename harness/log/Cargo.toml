[package]
name = "prometheus-log"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Durable hash-chained event log for the sovereign harness"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
gpu = []
