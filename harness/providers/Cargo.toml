[package]
name = "prometheus-providers"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Token broker, transport validation, AIMD, and provider failover"
publish = false

[dependencies]
prometheus-raft = { path = "../raft" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
gpu = []
