[package]
name = "prometheus-leases"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Task queue, work leases, heartbeats, and attempt-keyed outputs"
publish = false

[dependencies]
prometheus-log = { path = "../log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
gpu = []
